<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <rect width="160" height="160" rx="8" fill="#0e0e0e"/>
  <!-- Arc : cercle quasi complet centré (80,80) rayon 42, sens horaire, ouverture en bas-droite -->
  <path d="M 66 119 A 42 42 0 1 1 94 119"
        fill="none" stroke="#d8ccb0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pointe de flèche : tangente vers droite-haut au point (94,119) -->
  <polyline points="86,128 94,119 83,115"
            fill="none" stroke="#d8ccb0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
