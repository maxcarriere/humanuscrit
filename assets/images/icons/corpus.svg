  <line x1="74" y1="38" x2="74" y2="52" stroke="#d8ccb0" stroke-width="1.5" opacity="0.4"/>
  <!-- Livre 3 -->
  <rect x="94" y="30" width="24" height="95" rx="2" fill="none" stroke="#d8ccb0" stroke-width="2.5"/>
  <line x1="106" y1="38" x2="106" y2="52" stroke="#d8ccb0" stroke-width="1.5" opacity="0.4"/>
  <!-- Étagère -->
