<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <rect width="160" height="160" rx="8" fill="#0e0e0e"/>
  <!-- Crayon droit -->
  <g transform="translate(80,80) rotate(-45) translate(-80,-80)">
    <!-- Corps du crayon -->
    <rect x="72" y="30" width="16" height="80" rx="1" fill="none" stroke="#d8ccb0" stroke-width="2.5"/>
    <!-- Pointe -->
    <polygon points="72,110 88,110 80,130" fill="none" stroke="#d8ccb0" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Gomme -->
    <rect x="72" y="22" width="16" height="10" rx="2" fill="none" stroke="#d8ccb0" stroke-width="2.5"/>
    <!-- Ligne séparatrice gomme -->
    <line x1="72" y1="30" x2="88" y2="30" stroke="#d8ccb0" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>
