baseurl: ""
url: "https://humanuscrit.com"

title: Humanuscrit
description: "Éditeur indépendant français — littérature d'anticipation, textes coécrits avec l'intelligence artificielle. Premier roman : System Down."
lang: fr
author:
  name: Max Carrière
theme: minima

# Laisser $$ et $ intacts pour KaTeX ; limiter l’interprétation tableau (pipe en blockquote)
kramdown:
  input: GFM
  math_engine:
  parse_block_html: true

defaults:
  - scope:
      path: ""
    values:
      layout: page

header_pages:
  - edition.md
  - productions/index.md
  - textes/index.md
  - contact.md

include:
  - .well-known
  - AGENTS.md
  - EDITORIAL_REVIEW.md
  - openapi.yaml

exclude:
  - site_backup_20260914
  - 02_style-site.md
  - 03_pied_de_page.md
  - creation_site.md
  - CONTRIBUTING.md
  - README.md

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Compteur accueil : simplifié, basé sur un badge SVG externe.
