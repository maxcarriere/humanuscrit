# Humanuscrit API (HAPP v1)
# Le site statique est sur GitHub Pages. Netlify héberge uniquement l'API.

[build]
  command = "mkdir -p _api"
  publish = "_api"
  functions = "netlify/functions"

# Headers CORS pour l'API
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, X-Payment, X-Agent-Id, Idempotency-Key"
